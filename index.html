<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="message">Welcome! Please set your names then start the game!</div>
    <div class="board">
        <div class="square" data-item="0"></div>
        <div class="square" data-item="1"></div>
        <div class="square" data-item="2"></div>
        <div class="square" data-item="3"></div>
        <div class="square" data-item="4"></div>
        <div class="square" data-item="5"></div>
        <div class="square" data-item="6"></div>
        <div class="square" data-item="7"></div>
        <div class="square" data-item="8"></div>
    </div>
    <div class="scoreboard">
        <div class="player1">
            <div id="p1-info">
                <div class="name">Player 1</div>
                <div class="score">0</div>
            </div>
            <div class="set-name">
                <input type="text" name="p1-name" id="p1-name">
                <button>Set Name</button>
            </div>
        </div>
        <button id="game">Start Game</button>
        <div class="player2">
            <div id="p2-info">
                <div class="score">0</div>
                <div class="name">Player 2</div>
            </div>
            <div class="set-name">
                <input type="text" name="p2-name" id="p2-name">
                <button>Set Name</button>
            </div>
        </div>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
