<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="message">test message</div>
    <div class="board">
        <div class="square" data-item="0"></div>
        <div class="square" data-item="1"></div>
        <div class="square" data-item="2"></div>
        <div class="square" data-item="3"></div>
        <div class="square" data-item="4"></div>
        <div class="square" data-item="5"></div>
        <div class="square" data-item="6"></div>
        <div class="square" data-item="7"></div>
        <div class="square" data-item="8"></div>
    </div>
    <div class="scoreboard">
        <div class="player1">
            <div class="name">name</div>
            <div class="score">--</div>
        </div>
        <div class="round">000</div>
        <div class="player2">
            <div class="score">--</div>
            <div class="name">name</div>
        </div>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
